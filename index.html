<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peng Lai's Homepage</title>
  <meta name="description" content="Peng Lai personal homepage.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" as="image" href="images/1.webp">
  <!-- GoatCounter analytics -->
  <script
    data-goatcounter="https://llllp.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js"></script>
  <style>
    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 100 800;
      font-display: swap;
      src: url("vendor/fonts/jetbrains-mono-latin-wght.woff2") format("woff2");
    }

    :root {
      --font-body: "Times New Roman", Times, "Songti SC", SimSun, serif;
      --font-heading: var(--font-body);
      --font-display: var(--font-body);
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --line: #e8e8e8;
      --sec-px: 30px;
      --line-strong: #cfcfcf;
      --primary-text: #111111;
      --secondary-text: #333333;
      --muted-text: #777777;
      --accent-color: #1c1917;
      --accent-hover: #000000;
      --accent-bg: #f5f5f4;
      --accent-border: #d6d3d1;
      --accent-rgb: 28, 25, 23;
      --band-tint: 245, 245, 244;
      --bg-top: #ffffff;
      --link-color: #333333;
      --border-color: #cfcfcf;
      --border-light: #e8e8e8;
      --bg-page: #ffffff;
      --card-bg: #ffffff;
      --inset-bg: #ffffff;
      --card-inner-bg: #ffffff;
      --callout-bg: #ffffff;
      --callout-border: #e8e8e8;
      --callout-text: #333333;
      --max-width: 900px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      font-size: 15.5px;
      color: var(--secondary-text);
      line-height: 1.58;
      background-color: var(--bg-page);
      background-image: linear-gradient(180deg, var(--bg-top) 0, var(--bg-page) 520px);
      background-repeat: no-repeat;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Navigation shares the main column's alignment */
    .nav-layout {
      position: sticky;
      top: 14px;
      z-index: 100;
      width: min(calc(100% - 24px), var(--max-width));
      margin: 14px auto 0;
    }

    .site-nav {
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      box-shadow: 0 4px 16px -8px rgba(15, 23, 42, 0.12);
      padding: 6px 10px;
    }

    .nav-inner {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 38px;
      padding: 0 6px;
    }

    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary-text);
      text-decoration: none;
      white-space: nowrap;
      padding: 4px 8px 4px 4px;
      border-radius: 10px;
      flex-shrink: 0;
      transition: color 0.18s ease;
    }

    .nav-brand svg {
      flex-shrink: 0;
      color: var(--accent-color);
      transition: transform 0.2s ease;
    }

    .nav-brand:hover {
      color: var(--accent-color);
      text-decoration: none;
    }

    .nav-brand:hover svg {
      transform: scale(1.1);
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: nowrap;
      gap: 0;
      min-width: 0;
    }

    .nav-links a {
      padding: 5px 8px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted-text);
      border-radius: 10px;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-links a:hover {
      color: var(--primary-text);
      background: rgba(28, 25, 23, 0.05);
      text-decoration: none;
    }

    .nav-links a.active {
      color: var(--accent-color);
      background: var(--accent-bg);
      box-shadow: inset 0 0 0 1px var(--accent-border);
      text-decoration: none;
    }

    /* Two-column homepage shell */
    .page-layout {
      width: min(calc(100% - 24px), var(--max-width));
      margin: 18px auto 36px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
    }

    /* Main Container Card (Scheme A) */
    .main-container {
      grid-area: 1 / 1;
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 4px 0 20px;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      position: relative;
    }

    .profile-header,
    .content-section,
    .research-blog-section {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px -16px rgba(15, 23, 42, 0.12);
    }

    .content-section,
    .research-blog-section {
      padding: 20px 28px 22px;
      margin: 0 0 14px;
    }

    .content-section > .section-title:first-child,
    .research-blog-section > .section-title:first-child {
      margin-top: 0;
    }

    #main-content {
      min-width: 0;
    }

    .research-blog-section {
      margin-top: 0;
    }

    .research-blog-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Profile Header */
    .profile-header {
      display: flex;
      gap: 28px;
      align-items: center;
      margin-bottom: 10px;
      padding: 28px 32px;
      border-bottom: none;
    }

    .profile-avatar {
      width: 104px;
      height: 104px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 16px rgba(28, 25, 23, 0.08), 0 0 0 1px rgba(226, 232, 240, 0.9);
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .profile-avatar:hover {
      transform: scale(1.03);
    }

    .profile-name {
      margin: 0;
      line-height: 1.15;
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--primary-text);
      letter-spacing: -0.015em;
    }

    .profile-role {
      margin: 6px 0 5px;
      color: var(--secondary-text);
      font-weight: 600;
      font-size: 0.98rem;
    }

    .profile-research {
      margin: 0 0 5px;
      color: var(--secondary-text);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .label-strong {
      font-weight: 700;
      color: var(--primary-text);
    }

    .hobby-block {
      margin: 0;
      padding: 0;
    }

    .hobby-text {
      margin: 0;
      color: var(--muted-text);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .quick-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border-light);
      background: #ffffff;
      color: var(--secondary-text);
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      transition: all 0.18s ease;
    }

    .quick-link svg {
      flex-shrink: 0;
      color: inherit;
    }

    .quick-link:hover {
      border-color: var(--accent-border);
      background: var(--accent-bg);
      color: var(--accent-color);
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(var(--accent-rgb), 0.1);
      text-decoration: none;
    }

    /* Headings & Section Titles */
    h1, h2, h3 {
      color: var(--primary-text);
      font-family: var(--font-heading);
      font-weight: 700;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-text);
      margin-top: 42px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--border-light);
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      scroll-margin-top: 88px;
    }

    .section-title::before {
      content: "";
      flex-shrink: 0;
      width: 4px;
      height: 1.05em;
      border-radius: 2px;
      background: var(--accent-color);
    }

    .subsection-title::before {
      display: none;
    }

    .subsection-title {
      font-size: 1.15rem;
      border-bottom: none;
      margin-top: 24px;
      margin-bottom: 12px;
      padding-bottom: 0;
    }

    .subsection-title::after {
      display: none;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .lead {
      font-size: 0.96rem;
      color: var(--secondary-text);
      margin-top: 8px;
      line-height: 1.7;
    }

    .collab-callout {
      margin: 18px 0 0;
      padding: 14px 18px;
      border: 1px solid var(--callout-border);
      border-left: 4px solid var(--accent-color);
      border-radius: 12px;
      background: var(--callout-bg);
      color: var(--callout-text);
      font-size: 0.93rem;
      line-height: 1.65;
      box-shadow: 0 2px 8px rgba(28, 25, 23, 0.04);
    }

    /* Modern List Style */
    .modern-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    .modern-list li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 9px;
      line-height: 1.65;
      color: var(--secondary-text);
    }

    .modern-list li::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 10px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-color);
      opacity: 0.85;
    }

    .modern-list-date {
      display: inline-block;
      font-weight: 700;
      color: var(--accent-color);
      font-size: 0.84rem;
      margin-right: 8px;
      padding: 1.5px 8px;
      border-radius: 6px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
    }

    .modern-list-content {
      display: inline;
    }

    .modern-list-content strong {
      color: var(--primary-text);
    }

    .teaching-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .teaching-list .modern-list-content {
      color: var(--primary-text);
      font-weight: 600;
    }

    .teaching-list .modern-list-date {
      margin-right: 0;
      flex-shrink: 0;
    }

    /* Experience Cards */
    .exp-card {
      background: var(--inset-bg);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 14px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .exp-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-color);
      box-shadow: 0 8px 22px -4px rgba(28, 25, 23, 0.08);
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exp-title {
      font-family: var(--font-heading);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--primary-text);
    }

    .exp-date {
      font-size: 0.82rem;
      color: var(--accent-color);
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      padding: 3px 11px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .exp-org {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--secondary-text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .company-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      border-radius: 4px;
      background: #fff;
      border: 1px solid var(--border-light);
      padding: 2px;
      flex-shrink: 0;
    }

    .exp-desc {
      font-size: 0.87rem;
      color: var(--muted-text);
      line-height: 1.55;
      margin-top: 2px;
    }

    .intern-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 8px;
    }

    .intern-card {
      background: var(--inset-bg);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      min-height: 108px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .intern-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px -2px rgba(28, 25, 23, 0.08);
      border-color: var(--border-color);
    }

    .intern-card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }

    .intern-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 10px;
      background: #fff;
      border: 1px solid var(--border-light);
      padding: 4px;
      flex-shrink: 0;
    }

    .intern-org {
      min-width: 0;
    }

    .intern-company {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-text);
      line-height: 1.3;
    }

    .intern-dept {
      margin-top: 3px;
      font-size: 0.8rem;
      color: var(--muted-text);
      line-height: 1.35;
    }

    .intern-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .intern-role {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--secondary-text);
      line-height: 1.3;
      min-width: 0;
    }

    /* Mini Cards (Working Papers) */
    .mini-card {
      background: var(--inset-bg);
      border: 1px solid var(--border-light);
      border-left: 4px solid var(--accent-color);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 12px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .mini-card:hover {
      transform: translateX(4px);
      box-shadow: 0 6px 18px -3px rgba(28, 25, 23, 0.08);
      border-left-color: var(--accent-hover);
      border-color: var(--border-color);
    }

    .mini-card-title {
      font-family: var(--font-heading);
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--primary-text);
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .mini-card-authors {
      font-size: 0.84rem;
      color: var(--secondary-text);
      line-height: 1.5;
    }

    .mini-card-authors strong {
      color: var(--primary-text);
    }

    /* Paper Cards */
    .research-blog-card {
      display: block;
      overflow: hidden;
      background: var(--inset-bg);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .research-blog-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-color);
      box-shadow: 0 6px 18px -2px rgba(28, 25, 23, 0.08);
    }

    .research-blog-content {
      padding: 12px 16px;
    }

    .research-blog-meta,
    .research-blog-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .research-blog-meta {
      margin: 0;
      color: var(--muted-text);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .research-blog-status {
      color: #15803d;
    }

    .research-blog-title {
      margin: 0 0 6px;
      font-family: var(--font-heading);
      font-size: 0.98rem;
      line-height: 1.35;
      color: var(--primary-text);
    }

    .research-blog-title a {
      color: inherit;
    }

    .research-blog-title a:hover {
      color: var(--accent-color);
      text-decoration: none;
    }

    .research-blog-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .research-blog-tag {
      padding: 2px 8px;
      border-radius: 6px;
      background: #e8eef5;
      color: #475569;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .research-blog-read {
      margin-left: auto;
      color: var(--accent-color);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .paper-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      background: var(--inset-bg);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      gap: 18px;
    }

    .paper-card:hover {
      box-shadow: 0 8px 24px -4px rgba(28, 25, 23, 0.08);
      transform: translateY(-2px);
      border-color: var(--border-color);
    }

    /* Academic Services Bento Grid */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 14px;
      margin-bottom: 24px;
    }

    .service-tile {
      background: var(--inset-bg);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 13px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      min-height: 80px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .service-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px -2px rgba(28, 25, 23, 0.08);
      border-color: var(--border-color);
    }

    .tile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tile-conf-name {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-text);
      letter-spacing: -0.01em;
    }

    .tile-years {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tile-year-pill {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent-color);
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      padding: 2px 8.5px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: none;
    }

    .tile-year-pill small {
      font-weight: 500;
      opacity: 0.85;
      margin-left: 3px;
    }

    .tile-full-name {
      font-size: 0.81rem;
      color: var(--muted-text);
      line-height: 1.35;
    }

    @media (max-width: 640px) {
      .service-grid,
      .intern-grid {
        grid-template-columns: 1fr;
      }
    }

    .paper-image-container {
      flex: 0 0 215px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-light);
      background: var(--card-bg);
    }

    .paper-image-container img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
    }

    .paper-card:hover .paper-image-container img {
      transform: scale(1.02);
    }

    .paper-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .paper-title {
      font-family: var(--font-heading);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--primary-text);
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .paper-authors {
      font-size: 0.85rem;
      color: var(--secondary-text);
      line-height: 1.55;
    }

    .paper-authors strong {
      color: var(--primary-text);
      font-weight: 600;
    }

    .paper-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .paper-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .conf-badge,
    .ccf-badge,
    .jcr-badge {
      display: inline-flex;
      align-items: center;
      padding: 2.5px 9px;
      border-radius: 999px;
      letter-spacing: 0.3px;
      cursor: default;
      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        color 0.18s ease;
    }

    .conf-badge {
      background: var(--accent-bg);
      color: var(--accent-color);
      border: 1px solid var(--accent-border);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .conf-badge:hover {
      transform: translateY(-1px);
      background: var(--accent-bg);
      border-color: var(--accent-color);
      box-shadow: 0 3px 8px rgba(var(--accent-rgb), 0.12);
    }

    .ccf-badge {
      background: #fff7ed;
      color: #b45309;
      border: 1px solid #fcd34d;
      padding: 2.5px 8px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .ccf-badge:hover {
      transform: translateY(-1px);
      background: #ffedd5;
      border-color: #fbbf24;
      color: #9a3412;
      box-shadow: 0 3px 8px rgba(180, 83, 9, 0.12);
    }

    .jcr-badge {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #6ee7b7;
      padding: 2.5px 8px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .jcr-badge:hover {
      transform: translateY(-1px);
      background: #d1fae5;
      border-color: #34d399;
      color: #065f46;
      box-shadow: 0 3px 8px rgba(4, 120, 87, 0.12);
    }

    .conf-badge:active,
    .ccf-badge:active,
    .jcr-badge:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .paper-links .quick-link:hover {
      transform: translateY(-1px);
    }

    .paper-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Publications Toolbar */
    .publications-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .muted-note {
      font-size: 0.83rem;
      color: var(--muted-text);
      margin: 0;
    }

    .paper-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--border-light);
      border-radius: 999px;
      background: var(--card-inner-bg);
    }

    .paper-toggle-btn {
      border: none;
      background: transparent;
      color: var(--secondary-text);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .paper-toggle-btn:hover {
      color: var(--accent-color);
      background: var(--accent-bg);
    }

    .paper-toggle-btn.is-active {
      color: var(--accent-color);
      background: var(--accent-bg);
      box-shadow: inset 0 0 0 1px var(--accent-border);
    }

    #published-papers.is-selected-only .paper-card:not([data-selected="true"]) {
      display: none;
    }

    /* Reveal Animation */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      transition:
        opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      transition-delay: var(--reveal-delay, 0ms);
      will-change: opacity, transform;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== Crisp theme: Inter + JetBrains Mono, single sheet, small radii ===== */
    .main-container {
      padding: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px -22px rgba(15, 23, 42, 0.22);
      overflow: hidden;
    }

    .profile-header,
    .content-section,
    .research-blog-section {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      margin: 0;
    }

    .content-section,
    .research-blog-section {
      padding: 0 var(--sec-px) 22px;
    }

    /* Full-width tinted header band for each top-level section */
    .content-section > h1.section-title,
    .research-blog-section > .section-title:first-child {
      margin: 0 calc(-1 * var(--sec-px)) 14px;
      padding: 8px var(--sec-px);
      background: linear-gradient(90deg, rgba(var(--band-tint), 0.95) 0%, rgba(var(--band-tint), 0.45) 40%, rgba(255, 255, 255, 0) 80%);
      border-top: 1px solid var(--border-light);
      border-bottom: none;
      font-size: 1.22rem;
    }

    .profile-header {
      padding: 24px 30px 20px;
      gap: 24px;
    }

    .site-nav {
      border-radius: 8px;
    }

    .nav-links a,
    .nav-links a.active {
      border-radius: 4px;
    }

    .nav-links a.active {
      box-shadow: none;
    }

    /* Profile */
    .profile-name {
      font-size: 1.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .profile-tagline {
      margin: 5px 0 6px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--secondary-text);
      letter-spacing: -0.01em;
    }

    .profile-tagline .prompt {
      color: var(--accent-color);
      font-weight: 700;
      margin-right: 6px;
    }

    .profile-tagline .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1.05em;
      margin-left: 3px;
      vertical-align: -0.18em;
      background: var(--accent-color);
      animation: cursor-blink 1.1s steps(1) infinite;
    }

    @keyframes cursor-blink {
      50% { opacity: 0; }
    }

    .quick-link {
      border-radius: 4px;
      border-color: var(--line-strong);
      color: var(--primary-text);
      font-weight: 500;
      box-shadow: none;
    }

    .quick-link:hover {
      box-shadow: none;
      transform: none;
      border-color: var(--accent-color);
    }

    /* Section titles */
    .section-title {
      font-size: 1.32rem;
      font-weight: 700;
      letter-spacing: 0;
      margin-bottom: 10px;
      padding-bottom: 0;
      border-bottom: none;
    }

    .section-title::before {
      width: 3px;
      height: 0.95em;
      border-radius: 0;
    }

    .subsection-title {
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 0;
      margin-top: 16px;
      margin-bottom: 8px;
    }

    .collab-callout {
      border-radius: 4px;
      border-left-width: 3px;
      background: var(--callout-bg);
      box-shadow: none;
    }

    /* Dated lists: date column + content column */
    .dated-list li {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 12px;
      padding-left: 0;
      margin-bottom: 4px;
    }

    .dated-list li::before {
      display: none;
    }

    .modern-list-date {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted-text);
      background: none;
      border: none;
      padding: 0;
      margin-right: 0;
      border-radius: 0;
      line-height: 1.95;
      white-space: nowrap;
    }

    .teaching-list li {
      padding-left: 0;
      padding-bottom: 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--line);
    }

    .teaching-list li:last-child {
      border-bottom: none;
    }

    .teaching-list li::before {
      display: none;
    }

    .teaching-list .modern-list-content {
      font-weight: 500;
    }

    /* Publications: flat rows divided by hairlines */
    .paper-card {
      background: none;
      border: none;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
      padding: 12px 0;
      margin: 0;
      gap: 18px;
    }

    .paper-card:hover {
      box-shadow: none;
      transform: none;
    }

    #published-papers .paper-card:first-child,
    #published-papers.is-selected-only .paper-card[data-selected="true"]:first-of-type {
      padding-top: 2px;
    }

    .paper-image-container {
      border-radius: 4px;
      border-color: var(--line);
    }

    .paper-title {
      font-size: 1.04rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .paper-title:hover {
      color: var(--accent-color);
    }

    .paper-authors strong {
      font-weight: 700;
    }

    .conf-badge,
    .ccf-badge,
    .jcr-badge {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0;
      border-radius: 3px;
      padding: 2px 7px;
    }

    .conf-badge {
      background: var(--accent-bg);
      color: var(--accent-color);
      border: 1px solid var(--accent-border);
    }

    .ccf-badge {
      background: #fff7ed;
      color: #b45309;
      border: 1px solid #fcd34d;
    }

    .jcr-badge {
      background: #f5f3ff;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
    }

    .paper-toggle,
    .paper-toggle-btn {
      border-radius: 4px;
    }

    .paper-toggle-btn.is-active {
      color: var(--accent-color);
      background: var(--accent-bg);
      box-shadow: inset 0 0 0 1px var(--accent-border);
    }

    /* Working papers: light hanging-bullet list */
    .working-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 2px;
    }

    .working-list .mini-card {
      position: relative;
      background: none;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0 0 0 18px;
      margin: 0;
    }

    .working-list .mini-card::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 0.62em;
      width: 6px;
      height: 6px;
      background: var(--accent-color);
      transform: rotate(45deg);
    }

    .working-list .mini-card:hover {
      transform: none;
      box-shadow: none;
    }

    .working-list .mini-card:hover .mini-card-title {
      color: var(--accent-color);
    }

    .mini-card-title {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.4;
      margin-bottom: 1px;
      transition: color 0.18s ease;
    }

    .mini-card-authors {
      font-size: 0.85rem;
      color: var(--muted-text);
    }

    .role-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 0 5px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      line-height: 1.5;
      vertical-align: 1px;
      color: var(--accent-color);
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 3px;
    }

    .mini-card-authors sup,
    .paper-authors sup {
      line-height: 0;
    }

    .mini-card-status:empty {
      display: none;
    }

    /* Framed tiles: internships, education, services */
    .intern-card,
    .service-tile {
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: none;
    }

    .intern-card:hover,
    .service-tile:hover {
      transform: none;
      box-shadow: none;
      border-color: var(--line-strong);
    }

    .intern-logo {
      border-radius: 4px;
    }

    .intern-company,
    .tile-conf-name {
      font-weight: 700;
      letter-spacing: 0;
    }

    .modern-list-date {
      justify-self: start;
      align-self: start;
      margin-top: 3px;
      padding: 0 6px;
      line-height: 1.6;
      font-weight: 600;
      color: var(--accent-color);
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 4px;
    }

    .collab-callout {
      background: var(--callout-bg);
      border-color: var(--callout-border);
      border-left-color: var(--accent-color);
    }

    .paper-image-container {
      flex: 0 0 180px;
    }

    .paper-content {
      gap: 4px;
    }

    .paper-footer {
      margin-top: 1px;
    }

    .lead {
      margin-top: 0;
    }

    .content-section p {
      margin: 0 0 8px;
    }

    .modern-list li {
      margin-bottom: 4px;
    }

    .collab-callout {
      margin-top: 10px;
      padding: 9px 14px;
    }

    .publications-toolbar {
      margin-bottom: 6px;
    }

    .intern-grid {
      gap: 10px;
      margin-bottom: 2px;
    }

    .intern-card {
      padding: 11px 14px;
      gap: 8px;
      min-height: 0;
    }

    .service-grid {
      gap: 10px;
      margin-top: 0;
      margin-bottom: 2px;
    }

    .service-tile {
      padding: 9px 14px;
      gap: 2px;
      min-height: 0;
    }

    .exp-date,
    .tile-year-pill {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--accent-color);
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 3px;
      padding: 1px 6px;
    }

    /* ===== Monochrome academic style (Barron-like): no decorative color ===== */
    body {
      background: #ffffff;
    }

    a {
      color: var(--link-color);
      text-decoration: underline;
      text-decoration-color: #b8b8b8;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      transition: text-decoration-color 0.15s ease, color 0.15s ease;
    }

    a:hover {
      color: #000000;
      text-decoration-color: #000000;
    }

    /* Navigation: plain text, active item underlined */
    .site-nav {
      background: rgba(255, 255, 255, 0.94);
      border: none;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
    }

    .nav-layout {
      top: 0;
      margin-top: 0;
    }

    .nav-brand,
    .nav-brand:hover,
    .nav-brand svg {
      color: var(--primary-text);
      text-decoration: none;
    }

    .nav-links a {
      color: var(--muted-text);
      text-decoration: none;
    }

    .nav-links a:hover {
      background: none;
      color: var(--primary-text);
    }

    .nav-links a.active {
      background: none;
      color: var(--primary-text);
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-color: var(--primary-text);
    }

    /* Page: no sheet, no cards */
    .main-container {
      background: none;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
    }

    .profile-header {
      padding: 28px 0 18px;
    }

    .content-section,
    .research-blog-section {
      padding: 0 0 18px;
    }

    /* Section titles: bold text over a hairline */
    .content-section > h1.section-title,
    .research-blog-section > .section-title:first-child {
      margin: 10px 0 12px;
      padding: 0 0 5px;
      background: none;
      border-top: none;
      border-bottom: 1px solid var(--line-strong);
      font-size: 1.3rem;
    }

    .section-title::before {
      display: none;
    }

    .subsection-title {
      border-bottom: none;
      padding-bottom: 0;
    }

    /* Profile */
    .profile-avatar {
      border: none;
      box-shadow: none;
    }

    .profile-tagline,
    .profile-tagline .prompt {
      color: var(--muted-text);
    }

    .profile-tagline .cursor {
      background: var(--muted-text);
    }

    /* Outlined monochrome buttons (profile links + paper links) */
    .quick-links {
      gap: 8px;
      margin-top: 10px;
    }

    .quick-link,
    .paper-links .quick-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: #ffffff;
      box-shadow: none;
      font-size: 0.85rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--secondary-text);
      text-decoration: none;
      text-transform: none;
    }

    .quick-link svg {
      display: inline-block;
      color: var(--muted-text);
    }

    .quick-link:hover,
    .paper-links .quick-link:hover {
      border-color: var(--primary-text);
      color: var(--primary-text);
      background: #ffffff;
      box-shadow: none;
      transform: none;
      text-decoration: none;
    }

    .quick-link:hover svg {
      color: var(--primary-text);
    }

    /* Lists */
    .modern-list li::before {
      background: var(--muted-text);
      opacity: 0.7;
      width: 4px;
      height: 4px;
      top: 11px;
    }

    .modern-list-date,
    .exp-date,
    .tile-year-pill {
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--muted-text);
      background: none;
      border: none;
      border-radius: 0;
      padding: 0;
      margin: 0;
      line-height: inherit;
    }

    .dated-list li {
      grid-template-columns: 64px minmax(0, 1fr);
      align-items: baseline;
    }

    .dated-list .modern-list-date {
      align-self: baseline;
    }

    .teaching-list li {
      align-items: baseline;
    }

    .collab-callout {
      background: none;
      border: none;
      border-left: 2px solid var(--line-strong);
      border-radius: 0;
      padding: 2px 0 2px 14px;
      font-style: italic;
    }

    .collab-callout strong {
      font-style: normal;
    }

    /* Publications */
    .paper-card {
      border-bottom: none;
      padding: 10px 0;
      align-items: flex-start;
    }

    .paper-image-container {
      border: none;
      border-radius: 0;
    }

    .paper-card:hover .paper-image-container img {
      transform: none;
    }

    .paper-title:hover {
      color: inherit;
    }

    .paper-footer {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      margin-top: 3px;
    }

    .paper-meta {
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .conf-badge,
    .ccf-badge,
    .jcr-badge,
    .conf-badge:hover,
    .ccf-badge:hover,
    .jcr-badge:hover {
      font-family: var(--font-body);
      box-shadow: none;
      transform: none;
      letter-spacing: 0;
    }

    /* Venue: bold plain text */
    .conf-badge,
    .conf-badge:hover {
      padding: 0;
      background: none;
      border: none;
      border-radius: 0;
      font-size: 0.95rem;
      font-style: normal;
      font-weight: 700;
      color: var(--primary-text);
    }

    /* Tier (CCF-A / JCR Q1): light gray tag */
    .ccf-badge,
    .jcr-badge,
    .ccf-badge:hover,
    .jcr-badge:hover {
      padding: 0 6px;
      background: #efefef;
      border: 1px solid #efefef;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.55;
      color: #333333;
    }

    .paper-links {
      gap: 6px;
    }

    .paper-links .quick-link {
      padding: 1px 9px;
      font-size: 0.82rem;
    }

    .paper-toggle {
      border: none;
      padding: 0;
      gap: 0;
      background: none;
    }

    .paper-toggle-btn,
    .paper-toggle-btn:hover {
      padding: 0 2px;
      background: none;
      border-radius: 0;
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--muted-text);
      box-shadow: none;
    }

    .paper-toggle-btn + .paper-toggle-btn::before {
      content: "/";
      margin: 0 8px 0 4px;
      color: var(--line-strong);
    }

    .paper-toggle-btn.is-active {
      background: none;
      box-shadow: none;
      color: var(--primary-text);
      font-weight: 700;
    }

    .nav-layout .site-nav {
      border-radius: 0;
      box-shadow: none;
    }

    /* Working papers: plain list */
    .working-list {
      gap: 8px;
    }

    .working-list .mini-card {
      padding-left: 0;
    }

    .working-list .mini-card::before {
      display: none;
    }

    .working-list .mini-card:hover .mini-card-title {
      color: inherit;
    }

    /* Internships & education: one row per entry */
    .intern-grid {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .intern-card,
    .intern-card:hover {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: none;
      transform: none;
    }

    .intern-card-top {
      align-items: center;
      flex: 1;
    }

    .intern-logo {
      width: 36px;
      height: 36px;
      border: none;
      padding: 0;
      border-radius: 0;
    }

    .intern-card-meta {
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 0;
      flex-shrink: 0;
      text-align: right;
    }

    .intern-role {
      font-weight: 400;
      font-style: italic;
      font-size: 0.9rem;
    }

    /* Services: single line */
    .service-line {
      margin: 0;
    }

    /* Teaching */
    .teaching-list li {
      border-bottom: none;
      padding-bottom: 0;
    }

    .teaching-list .modern-list-content {
      font-weight: 400;
    }

    @media (max-width: 640px) {
      .intern-card,
      .intern-card:hover {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }

      .intern-card-meta {
        flex-direction: row;
        align-items: baseline;
        gap: 10px;
        padding-left: 48px;
      }
    }

    /* ===== Monochrome interactions ===== */
    /* Buttons invert on hover */
    .quick-link,
    .paper-links .quick-link {
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .quick-link:hover,
    .paper-links .quick-link:hover {
      background: var(--primary-text);
      border-color: var(--primary-text);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .quick-link:hover svg {
      color: #ffffff;
    }

    .quick-link:active,
    .paper-links .quick-link:active {
      transform: translateY(0);
    }

    /* Rows highlight on hover: papers, working papers, internships, education */
    .paper-card,
    .working-list .mini-card {
      margin-left: -12px;
      margin-right: -12px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 0;
      box-shadow: inset 0 0 0 transparent;
      transition: box-shadow 0.2s ease;
    }

    .working-list .mini-card {
      padding-top: 6px;
      padding-bottom: 6px;
    }

    .working-list {
      gap: 2px;
    }

    .paper-card:hover,
    .working-list .mini-card:hover {
      background: none;
      box-shadow: inset 2px 0 0 var(--primary-text);
    }

    /* Paper figure zooms gently */
    .paper-image-container {
      overflow: hidden;
      border-radius: 4px;
    }

    .paper-image-container img {
      transition: transform 0.35s ease;
    }

    .paper-card:hover .paper-image-container img {
      transform: scale(1.04);
    }

    /* Nav: underline slides in */
    .nav-links a {
      position: relative;
      transition: color 0.18s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 1px;
      height: 1px;
      background: var(--primary-text);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.22s ease;
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      transform: scaleX(1);
    }

    .nav-links a.active {
      text-decoration: none;
    }

    /* Selected / All toggle */
    .paper-toggle-btn {
      transition: color 0.15s ease;
    }

    .paper-toggle-btn:hover:not(.is-active) {
      color: var(--primary-text);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .quick-link:hover,
      .paper-links .quick-link:hover,
      .paper-card:hover .paper-image-container img {
        transform: none;
      }

      .nav-links a::after {
        transition: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .profile-tagline .cursor {
        animation: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal {
        opacity: 1;
        transform: none;
        transition: none;
        will-change: auto;
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      .profile-header,
      .content-section,
      .research-blog-section {
        background: var(--card-bg);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav-layout {
        top: 10px;
        width: calc(100% - 20px);
        margin-top: 10px;
      }

      .site-nav {
        padding: 4px 6px;
        border-radius: 16px;
      }

      .nav-brand span {
        display: none;
      }

      .nav-links {
        justify-content: flex-start;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .nav-links::-webkit-scrollbar {
        display: none;
      }

      .main-container {
        padding: 0;
      }

      :root {
        --sec-px: 16px;
      }

      .profile-header {
        padding: 16px 16px 18px;
      }

      .content-section,
      .research-blog-section {
        padding: 0 var(--sec-px) 18px;
      }

      .profile-name {
        font-size: 1.7rem;
      }

      .page-layout {
        width: calc(100% - 24px);
        margin: 14px auto 32px;
      }

      .profile-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .paper-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 12px 0;
        gap: 10px;
      }

      .dated-list li {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .paper-image-container {
        flex: 100%;
        width: 100%;
        max-width: 100%;
      }

      .nav-inner {
        padding: 0 14px;
      }
    }

    @media (max-width: 768px) {
      .paper-card,
      .working-list .mini-card {
        margin-left: -8px;
        margin-right: -8px;
        padding-left: 8px;
        padding-right: 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Sticky navigation aligned with the main profile card -->
  <div class="nav-layout">
    <nav class="site-nav" aria-label="Main Navigation">
    <div class="nav-inner">
      <a href="#" class="nav-brand" aria-label="Back to top">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Peng Lai's Homepage</span>
      </a>
      <div class="nav-links">
        <a href="#about-me">About</a>
        <a href="#news">News</a>
        <a href="#publications">Publications</a>
        <a href="#working-papers">Working Papers</a>
        <a href="#internships">Internships</a>
        <a href="#education">Education</a>
        <a href="#honors">Honors</a>
        <a href="#services">Services</a>
        <a href="#teaching">Teaching</a>
      </div>
    </div>
    </nav>
  </div>

  <!-- Responsive two-column academic homepage -->
  <div class="page-layout">
    <main class="main-container">
      <header class="profile-header" id="profile-header"></header>
      <div id="main-content"></div>
    </main>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script>
    function initScrollReveal() {
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const revealSelector = [
        "#main-content .section-title",
        "#main-content .subsection-title",
        "#main-content .lead",
        "#main-content .collab-callout",
        "#main-content .publications-toolbar",
        "#main-content .paper-card",
        "#main-content .exp-card",
        "#main-content .intern-card",
        "#main-content .mini-card",
        "#main-content .service-tile",
        "#main-content .modern-list li",
      ].join(", ");

      const markVisible = (element) => {
        element.classList.add("reveal", "is-visible");
      };

      const prepareElement = (element, staggerIndex) => {
        if (element.classList.contains("reveal")) return;
        element.classList.add("reveal");
        if (staggerIndex !== undefined) {
          element.style.setProperty("--reveal-delay", `${Math.min(staggerIndex, 5) * 50}ms`);
        }
      };

      const elements = Array.from(document.querySelectorAll(revealSelector));
      if (elements.length === 0) return;

      if (reducedMotion) {
        elements.forEach(markVisible);
        return;
      }

      const staggerParents = [
        document.getElementById("published-papers"),
        ...document.querySelectorAll("#main-content .modern-list"),
      ].filter(Boolean);

      staggerParents.forEach((parent) => {
        const children = parent.matches(".modern-list")
          ? Array.from(parent.querySelectorAll(":scope > li"))
          : Array.from(parent.querySelectorAll(":scope > .paper-card"));
        children.forEach((child, index) => prepareElement(child, index));
      });

      elements.forEach((element) => prepareElement(element));

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          });
        },
        {
          threshold: 0.08,
          rootMargin: "0px 0px -20px 0px",
        }
      );

      elements.forEach((element) => {
        if (!element.classList.contains("is-visible")) {
          observer.observe(element);
        }
      });

      window.refreshScrollReveal = () => {
        document
          .querySelectorAll("#published-papers .paper-card.reveal:not(.is-visible)")
          .forEach((card) => observer.observe(card));
      };
    }

    function initNavObserver() {
      const navLinks = Array.from(document.querySelectorAll(".site-nav .nav-links a[href^='#']"));
      const sectionMap = new Map();
      navLinks.forEach((link) => {
        const href = link.getAttribute("href");
        if (!sectionMap.has(href)) sectionMap.set(href, []);
        sectionMap.get(href).push(link);
      });

      const sectionElements = [...sectionMap.keys()]
        .map((href) => document.querySelector(href))
        .filter(Boolean);

      if (sectionElements.length === 0) return;

      // Ensure sections are sorted strictly in vertical DOM order
      sectionElements.sort((a, b) => {
        return (a.getBoundingClientRect().top + window.pageYOffset) - (b.getBoundingClientRect().top + window.pageYOffset);
      });

      let isClickScrolling = false;
      let scrollEndTimer = null;
      let currentActiveId = null;

      const setActiveSection = (id) => {
        if (!id || id === currentActiveId) return;
        currentActiveId = id;
        navLinks.forEach((link) => link.classList.remove("active"));
        const activeLinks = sectionMap.get(`#${id}`) || [];
        activeLinks.forEach((link) => {
          link.classList.add("active");
          link.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
        });
      };

      // Handle smooth scroll clicks accurately
      navLinks.forEach((link) => {
        link.addEventListener("click", (e) => {
          const href = link.getAttribute("href");
          if (!href || !href.startsWith("#")) return;
          const target = document.querySelector(href);
          if (!target) return;

          e.preventDefault();
          isClickScrolling = true;
          setActiveSection(href.slice(1));
          history.pushState(null, "", href);

          const nav = document.querySelector(".site-nav");
          const navBottom = nav ? nav.getBoundingClientRect().bottom : 58;
          const targetRect = target.getBoundingClientRect();
          const targetY = window.pageYOffset + targetRect.top - (navBottom + 16);

          window.scrollTo({
            top: Math.max(0, targetY),
            behavior: "smooth"
          });
        });
      });

      // Handle brand click (Back to top)
      const brand = document.querySelector(".site-nav .nav-brand");
      if (brand) {
        brand.addEventListener("click", (e) => {
          e.preventDefault();
          history.pushState(null, "", " ");
          window.scrollTo({ top: 0, behavior: "smooth" });
          navLinks.forEach((link) => link.classList.remove("active"));
          currentActiveId = null;
        });
      }

      const endClickScroll = () => {
        if (!isClickScrolling) return;
        isClickScrolling = false;
        updateActiveSection();
      };

      if ("onscrollend" in window) {
        window.addEventListener("scrollend", endClickScroll, { passive: true });
      }
      window.addEventListener("wheel", () => { isClickScrolling = false; }, { passive: true });
      window.addEventListener("touchmove", () => { isClickScrolling = false; }, { passive: true });

      // Continuous, deterministic scroll-spy for bidirectional scrolling (up and down)
      const updateActiveSection = () => {
        if (isClickScrolling) return;

        const nav = document.querySelector(".site-nav");
        const navBottom = nav ? nav.getBoundingClientRect().bottom : 58;
        const vh = window.innerHeight;
        const maxScroll = Math.max(0, document.documentElement.scrollHeight - vh);
        const remainingScroll = Math.max(0, maxScroll - window.pageYOffset);

        // Near the absolute bottom of the document
        if (remainingScroll < 90) {
          const lastEl = sectionElements[sectionElements.length - 1];
          if (lastEl) setActiveSection(lastEl.id);
          return;
        }

        // Dynamic probe line: normally 50px below the nav island.
        // As the user nears the document bottom where content can't scroll any higher,
        // dynamically lower probeY so bottom sections naturally activate.
        const baseProbe = navBottom + 50;
        let probeY = baseProbe;
        const bottomZone = Math.max(340, vh * 0.4);
        if (remainingScroll < bottomZone) {
          const t = 1 - (remainingScroll / bottomZone);
          probeY = baseProbe + t * (vh * 0.75 - baseProbe);
        }

        let activeId = null;
        for (let i = 0; i < sectionElements.length; i++) {
          const rect = sectionElements[i].getBoundingClientRect();
          if (rect.top <= probeY) {
            activeId = sectionElements[i].id;
          } else {
            break;
          }
        }

        if (activeId) {
          setActiveSection(activeId);
        } else {
          setActiveSection(sectionElements[0].id);
        }
      };

      let ticking = false;
      window.addEventListener("scroll", () => {
        clearTimeout(scrollEndTimer);
        scrollEndTimer = setTimeout(endClickScroll, 160);

        if (!ticking) {
          window.requestAnimationFrame(() => {
            updateActiveSection();
            ticking = false;
          });
          ticking = true;
        }
      }, { passive: true });

      // Run on page load and window resize
      updateActiveSection();
      window.addEventListener("resize", updateActiveSection);
    }

    function getPaperFilterFromHash() {
      return window.location.hash === "#publications-all" ? "all" : "selected";
    }

    function updatePaperHash(filter) {
      const newHash = filter === "all" ? "#publications-all" : "#publications";
      if (window.location.hash !== newHash) {
        history.replaceState(null, "", newHash);
      }
    }

    function sortPaperCards(container) {
      const cards = Array.from(container.querySelectorAll(".paper-card"));
      cards.sort((a, b) => {
        const rankA = Number(a.dataset.authorRank) || 99;
        const rankB = Number(b.dataset.authorRank) || 99;
        if (rankA !== rankB) return rankA - rankB;
        const yearA = Number(a.dataset.year) || 0;
        const yearB = Number(b.dataset.year) || 0;
        return yearB - yearA;
      });
      cards.forEach((card) => container.appendChild(card));
    }

    function initPaperToggle() {
      const container = document.getElementById("published-papers");
      const buttons = Array.from(document.querySelectorAll(".paper-toggle-btn"));
      if (!container || buttons.length === 0) return;

      const setFilter = (filter, updateHash = true) => {
        const isSelectedOnly = filter === "selected";
        container.classList.toggle("is-selected-only", isSelectedOnly);
        if (filter === "all") {
          sortPaperCards(container);
        }
        buttons.forEach((button) => {
          const active = button.dataset.filter === filter;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-selected", active ? "true" : "false");
        });
        if (updateHash) updatePaperHash(filter);
        if (typeof window.refreshScrollReveal === "function") {
          requestAnimationFrame(() => window.refreshScrollReveal());
        }
      };

      buttons.forEach((button) => {
        button.addEventListener("click", () => setFilter(button.dataset.filter));
      });

      setFilter(getPaperFilterFromHash(), false);

      window.addEventListener("hashchange", () => {
        setFilter(getPaperFilterFromHash(), false);
      });
    }

    async function loadFragment(path, mountNode, errorMessage, useMarked = true) {
      if (!mountNode) return;
      try {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Failed to load ${path}`);
        }
        const source = await response.text();
        mountNode.innerHTML = useMarked ? marked.parse(source) : source;
        mountNode.querySelectorAll("img").forEach((img) => {
          img.decoding = "async";
          if (!img.classList.contains("profile-avatar") && !img.hasAttribute("loading")) {
            img.loading = "lazy";
          }
        });
      } catch (error) {
        mountNode.innerHTML = `<p>${errorMessage}</p>`;
      }
    }

    async function loadProfile() {
      await loadFragment(
        "content/profile.md",
        document.getElementById("profile-header"),
        "Failed to load profile.",
        false
      );
    }

    function wrapContentSections() {
      const root = document.getElementById("main-content");
      if (!root || root.querySelector(":scope > .content-section")) return;

      const groups = [];
      let current = [];
      const flush = () => {
        if (!current.length) return;
        groups.push(current);
        current = [];
      };

      Array.from(root.childNodes).forEach((node) => {
        const startsSection =
          node.nodeType === 1 && node.matches("h1.section-title");
        if (startsSection && current.length) flush();
        current.push(node);
      });
      flush();

      groups.forEach((group) => {
        const section = document.createElement("section");
        section.className = "content-section";
        group[0].parentNode.insertBefore(section, group[0]);
        group.forEach((node) => section.appendChild(node));
      });
    }

    async function loadMainContent() {
      await loadFragment(
        "content/main.md",
        document.getElementById("main-content"),
        "Failed to load main content.",
        true
      );
    }

    (async () => {
      await Promise.all([loadProfile(), loadMainContent()]);
      wrapContentSections();
      initPaperToggle();
      initScrollReveal();
      initNavObserver();
    })();
  </script>
</body>
</html>
