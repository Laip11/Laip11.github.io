<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peng Lai (赖鹏)</title>
  <meta name="description" content="Peng Lai personal homepage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <!-- GoatCounter analytics -->
  <script
    data-goatcounter="https://llllp.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js"></script>
  <style>
    :root {
      --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-heading: "Source Serif 4", Georgia, "Times New Roman", serif;
      --primary-text: #0f172a;
      --secondary-text: #475569;
      --muted-text: #64748b;
      --accent-color: #9d3656;
      --accent-hover: #b84368;
      --accent-bg: #fdf2f6;
      --accent-border: #f5cbd8;
      --link-color: #1d4ed8;
      --border-color: #e2e8f0;
      --border-light: #f1f5f9;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --callout-bg: #f0f7ff;
      --callout-border: #bfdbfe;
      --callout-text: #1e3a5f;
      --max-width: 860px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      font-size: 15.5px;
      color: var(--secondary-text);
      line-height: 1.7;
      background: var(--bg-page);
      -webkit-font-smoothing: antialiased;
    }

    /* Top Sticky Navigation with Glassmorphism */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.02);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .nav-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--primary-text);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.18s ease;
    }

    .nav-brand svg {
      flex-shrink: 0;
      color: var(--accent-color);
      transition: transform 0.2s ease;
    }

    .nav-brand:hover {
      color: var(--accent-color);
      text-decoration: none;
    }

    .nav-brand:hover svg {
      transform: scale(1.1);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 3px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .nav-links::-webkit-scrollbar {
      display: none;
    }

    .nav-links a {
      padding: 5px 11px;
      font-size: 0.84rem;
      font-weight: 600;
      color: #526177;
      border-radius: 999px;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .nav-links a:hover {
      color: var(--accent-color);
      background: var(--accent-bg);
      text-decoration: none;
    }

    .nav-links a.active {
      color: #fff;
      background: var(--accent-color);
      text-decoration: none;
    }

    /* Main Container */
    .main-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* Profile Header */
    .profile-header {
      display: flex;
      gap: 28px;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border-color);
    }

    .profile-avatar {
      width: 104px;
      height: 104px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(226, 232, 240, 0.8);
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .profile-avatar:hover {
      transform: scale(1.03);
    }

    .profile-name {
      margin: 0;
      line-height: 1.15;
      font-family: var(--font-heading);
      font-size: 1.85rem;
      color: var(--primary-text);
      letter-spacing: -0.015em;
    }

    .profile-role {
      margin: 6px 0 5px;
      color: var(--secondary-text);
      font-weight: 600;
      font-size: 0.98rem;
    }

    .profile-research {
      margin: 0 0 5px;
      color: #334155;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .label-strong {
      font-weight: 700;
      color: var(--primary-text);
    }

    .hobby-block {
      margin: 0;
      padding: 0;
    }

    .hobby-text {
      margin: 0;
      color: var(--muted-text);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .quick-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid #d8e0ea;
      background: #ffffff;
      color: #334155;
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      transition: all 0.18s ease;
    }

    .quick-link svg {
      flex-shrink: 0;
      color: inherit;
    }

    .quick-link:hover {
      border-color: var(--accent-border);
      background: var(--accent-bg);
      color: var(--accent-color);
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(157, 54, 86, 0.12);
      text-decoration: none;
    }

    /* Headings & Section Titles */
    h1, h2, h3 {
      color: var(--primary-text);
      font-family: var(--font-heading);
      font-weight: 700;
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-text);
      margin-top: 42px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid #edf2f7;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      scroll-margin-top: 70px;
    }

    .section-title::after {
      content: "";
      position: absolute;
      bottom: -1.5px;
      left: 0;
      width: 32px;
      height: 2px;
      background: var(--accent-color);
      border-radius: 999px;
    }

    .subsection-title {
      font-size: 1.15rem;
      border-bottom: none;
      margin-top: 24px;
      margin-bottom: 12px;
      padding-bottom: 0;
    }

    .subsection-title::after {
      display: none;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .lead {
      font-size: 0.96rem;
      color: #334155;
      margin-top: 8px;
      line-height: 1.7;
    }

    .collab-callout {
      margin: 18px 0 0;
      padding: 13px 16px;
      border: 1px solid var(--callout-border);
      border-left: 3.5px solid #2563eb;
      border-radius: 10px;
      background: var(--callout-bg);
      color: var(--callout-text);
      font-size: 0.93rem;
      line-height: 1.65;
    }

    /* Modern List Style */
    .modern-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    .modern-list li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 9px;
      line-height: 1.65;
      color: var(--secondary-text);
    }

    .modern-list li::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 10px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-color);
      opacity: 0.85;
    }

    .modern-list-date {
      display: inline-block;
      font-weight: 700;
      color: var(--accent-color);
      font-size: 0.84rem;
      margin-right: 8px;
      padding: 1px 7px;
      border-radius: 5px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
    }

    .modern-list-content {
      display: inline;
    }

    .modern-list-content strong {
      color: var(--primary-text);
    }

    /* Experience Cards */
    .exp-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 12px;
      transition: all 0.22s ease;
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.02);
    }

    .exp-card:hover {
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
      transform: translateY(-1.5px);
      border-color: #cbd5e1;
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exp-title {
      font-family: var(--font-heading);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--primary-text);
    }

    .exp-date {
      font-size: 0.82rem;
      color: var(--accent-color);
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      padding: 3px 11px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .exp-org {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--secondary-text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .company-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
      border-radius: 4px;
      background: #fff;
      border: 1px solid #e2e8f0;
      padding: 2px;
      flex-shrink: 0;
    }

    .exp-desc {
      font-size: 0.87rem;
      color: var(--muted-text);
      line-height: 1.55;
      margin-top: 2px;
    }

    /* Mini Cards (Working Papers) */
    .mini-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 3.5px solid var(--accent-color);
      border-radius: 10px;
      padding: 13px 16px;
      margin-bottom: 12px;
      transition: all 0.22s ease;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.02);
    }

    .mini-card:hover {
      transform: translateX(3px);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
      border-left-color: var(--accent-hover);
    }

    .mini-card-title {
      font-family: var(--font-heading);
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--primary-text);
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .mini-card-authors {
      font-size: 0.84rem;
      color: var(--secondary-text);
      line-height: 1.5;
    }

    .mini-card-authors strong {
      color: var(--primary-text);
    }

    /* Paper Cards */
    .paper-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.02), 0 3px 10px rgba(15, 23, 42, 0.02);
      gap: 18px;
    }

    .paper-card:hover {
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      transform: translateY(-2px);
      border-color: #cbd5e1;
    }

    .paper-image-container {
      flex: 0 0 215px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #edf2f7;
      background: #fafafa;
    }

    .paper-image-container img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
    }

    .paper-card:hover .paper-image-container img {
      transform: scale(1.02);
    }

    .paper-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .paper-title {
      font-family: var(--font-heading);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--primary-text);
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .paper-authors {
      font-size: 0.85rem;
      color: var(--secondary-text);
      line-height: 1.55;
    }

    .paper-authors strong {
      color: var(--primary-text);
      font-weight: 600;
    }

    .paper-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
      flex-wrap: wrap;
    }

    .conf-badge {
      background: var(--accent-bg);
      color: var(--accent-color);
      border: 1px solid var(--accent-border);
      padding: 2.5px 9px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .ccf-badge {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fcd34d;
      padding: 2.5px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .paper-links {
      margin-top: 3px;
      display: flex;
      gap: 7px;
    }

    .paper-btn {
      display: inline-flex;
      align-items: center;
      padding: 3.5px 12px;
      border: 1px solid #d8e0ea;
      border-radius: 999px;
      font-size: 0.79rem;
      font-weight: 600;
      color: #334155;
      text-decoration: none;
      background: #fff;
      transition: all 0.18s ease;
      gap: 5px;
    }

    .paper-btn:hover {
      background: var(--accent-bg);
      border-color: var(--accent-border);
      color: var(--accent-color);
      text-decoration: none;
    }

    .paper-btn-primary {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    .paper-btn-primary:hover {
      background: #1e293b;
      border-color: #1e293b;
      color: #ffffff;
    }

    .paper-btn-secondary {
      background: #fff;
      border-color: var(--accent-border);
      color: var(--accent-color);
    }

    .paper-btn-secondary:hover {
      background: var(--accent-bg);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    /* Publications Toolbar */
    .publications-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .muted-note {
      font-size: 0.83rem;
      color: var(--muted-text);
      margin: 0;
    }

    .paper-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      background: #ffffff;
    }

    .paper-toggle-btn {
      border: none;
      background: transparent;
      color: var(--secondary-text);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .paper-toggle-btn:hover {
      color: var(--accent-color);
      background: var(--accent-bg);
    }

    .paper-toggle-btn.is-active {
      color: var(--accent-color);
      background: var(--accent-bg);
      box-shadow: inset 0 0 0 1px var(--accent-border);
    }

    #published-papers.is-selected-only .paper-card:not([data-selected="true"]) {
      display: none;
    }

    /* Reveal Animation */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      transition:
        opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      transition-delay: var(--reveal-delay, 0ms);
      will-change: opacity, transform;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal {
        opacity: 1;
        transform: none;
        transition: none;
        will-change: auto;
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-container {
        padding: 24px 16px 60px;
      }

      .profile-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .paper-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px;
        gap: 12px;
      }

      .paper-image-container {
        flex: 100%;
        width: 100%;
        max-width: 100%;
      }

      .nav-inner {
        padding: 0 14px;
      }
    }
  </style>
</head>
<body>
  <!-- Sticky Top Glassmorphism Navigation -->
  <nav class="site-nav" aria-label="Main Navigation">
    <div class="nav-inner">
      <a href="#profile-header" class="nav-brand" aria-label="Back to top">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Peng Lai's Homepage</span>
      </a>
      <div class="nav-links">
        <a href="#about-me">About</a>
        <a href="#news">News</a>
        <a href="#publications">Publications</a>
        <a href="#working-papers">Working Papers</a>
        <a href="#internships">Internships</a>
        <a href="#education">Education</a>
        <a href="#honors">Honors</a>
        <a href="#teaching">Teaching</a>
        <a href="#services">Services</a>
      </div>
    </div>
  </nav>

  <!-- Central Single-Column Content -->
  <main class="main-container">
    <header class="profile-header" id="profile-header"></header>
    <div id="main-content"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    function initScrollReveal() {
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const revealSelector = [
        "#main-content .section-title",
        "#main-content .subsection-title",
        "#main-content .lead",
        "#main-content .collab-callout",
        "#main-content .publications-toolbar",
        "#main-content .paper-card",
        "#main-content .exp-card",
        "#main-content .mini-card",
        "#main-content .modern-list li",
      ].join(", ");

      const markVisible = (element) => {
        element.classList.add("reveal", "is-visible");
      };

      const prepareElement = (element, staggerIndex) => {
        if (element.classList.contains("reveal")) return;
        element.classList.add("reveal");
        if (staggerIndex !== undefined) {
          element.style.setProperty("--reveal-delay", `${Math.min(staggerIndex, 5) * 50}ms`);
        }
      };

      const elements = Array.from(document.querySelectorAll(revealSelector));
      if (elements.length === 0) return;

      if (reducedMotion) {
        elements.forEach(markVisible);
        return;
      }

      const staggerParents = [
        document.getElementById("published-papers"),
        ...document.querySelectorAll("#main-content .modern-list"),
      ].filter(Boolean);

      staggerParents.forEach((parent) => {
        const children = parent.matches(".modern-list")
          ? Array.from(parent.querySelectorAll(":scope > li"))
          : Array.from(parent.querySelectorAll(":scope > .paper-card"));
        children.forEach((child, index) => prepareElement(child, index));
      });

      elements.forEach((element) => prepareElement(element));

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          });
        },
        {
          threshold: 0.08,
          rootMargin: "0px 0px -20px 0px",
        }
      );

      elements.forEach((element) => {
        if (!element.classList.contains("is-visible")) {
          observer.observe(element);
        }
      });

      window.refreshScrollReveal = () => {
        document
          .querySelectorAll("#published-papers .paper-card.reveal:not(.is-visible)")
          .forEach((card) => observer.observe(card));
      };
    }

    function initNavObserver() {
      const navLinks = Array.from(document.querySelectorAll(".site-nav .nav-links a[href^='#']"));
      const sectionMap = new Map();
      navLinks.forEach((link) => {
        const href = link.getAttribute("href");
        if (!sectionMap.has(href)) sectionMap.set(href, []);
        sectionMap.get(href).push(link);
      });
      const sections = [...sectionMap.keys()]
        .map((href) => document.querySelector(href))
        .filter(Boolean);

      if (sections.length === 0) return;

      let observer = null;

      const setActiveSection = (id) => {
        if (!id) return;
        navLinks.forEach((link) => link.classList.remove("active"));
        const activeLinks = sectionMap.get(`#${id}`) || [];
        activeLinks.forEach((link) => {
          link.classList.add("active");
          link.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
        });
      };

      const getObserverOptions = () => {
        const navHeight = document.querySelector(".site-nav")?.getBoundingClientRect().height || 52;
        const top = Math.round(window.innerHeight * 0.15 + navHeight);
        const bottom = Math.round(window.innerHeight * 0.45);
        return {
          rootMargin: `-${top}px 0px -${bottom}px 0px`,
          threshold: [0, 0.15, 0.4],
        };
      };

      const bindObserver = () => {
        if (observer) observer.disconnect();
        observer = new IntersectionObserver((entries) => {
          const visible = entries
            .filter((entry) => entry.isIntersecting)
            .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
          if (visible) setActiveSection(visible.target.id);
        }, getObserverOptions());
        sections.forEach((section) => observer.observe(section));
      };

      bindObserver();

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(bindObserver, 120);
      });
    }

    function getPaperFilterFromHash() {
      return window.location.hash === "#publications-all" ? "all" : "selected";
    }

    function updatePaperHash(filter) {
      const newHash = filter === "all" ? "#publications-all" : "#publications";
      if (window.location.hash !== newHash) {
        history.replaceState(null, "", newHash);
      }
    }

    function sortPaperCards(container) {
      const cards = Array.from(container.querySelectorAll(".paper-card"));
      cards.sort((a, b) => {
        const rankA = Number(a.dataset.authorRank) || 99;
        const rankB = Number(b.dataset.authorRank) || 99;
        if (rankA !== rankB) return rankA - rankB;
        const yearA = Number(a.dataset.year) || 0;
        const yearB = Number(b.dataset.year) || 0;
        return yearB - yearA;
      });
      cards.forEach((card) => container.appendChild(card));
    }

    function initPaperToggle() {
      const container = document.getElementById("published-papers");
      const buttons = Array.from(document.querySelectorAll(".paper-toggle-btn"));
      if (!container || buttons.length === 0) return;

      const setFilter = (filter, updateHash = true) => {
        const isSelectedOnly = filter === "selected";
        container.classList.toggle("is-selected-only", isSelectedOnly);
        if (filter === "all") {
          sortPaperCards(container);
        }
        buttons.forEach((button) => {
          const active = button.dataset.filter === filter;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-selected", active ? "true" : "false");
        });
        if (updateHash) updatePaperHash(filter);
        if (typeof window.refreshScrollReveal === "function") {
          requestAnimationFrame(() => window.refreshScrollReveal());
        }
      };

      buttons.forEach((button) => {
        button.addEventListener("click", () => setFilter(button.dataset.filter));
      });

      setFilter(getPaperFilterFromHash(), false);

      window.addEventListener("hashchange", () => {
        setFilter(getPaperFilterFromHash(), false);
      });
    }

    async function loadFragment(path, mountNode, errorMessage, useMarked = true) {
      if (!mountNode) return;
      try {
        const response = await fetch(path);
        if (!response.ok) {
          throw new Error(`Failed to load ${path}`);
        }
        const source = await response.text();
        mountNode.innerHTML = useMarked ? marked.parse(source) : source;
      } catch (error) {
        mountNode.innerHTML = `<p>${errorMessage}</p>`;
      }
    }

    async function loadProfile() {
      await loadFragment(
        "content/profile.md",
        document.getElementById("profile-header"),
        "Failed to load profile.",
        false
      );
    }

    async function loadMainContent() {
      await loadFragment(
        "content/main.md",
        document.getElementById("main-content"),
        "Failed to load main content.",
        true
      );
    }

    (async () => {
      await Promise.all([loadProfile(), loadMainContent()]);
      initPaperToggle();
      initScrollReveal();
      initNavObserver();
    })();
  </script>
</body>
</html>
